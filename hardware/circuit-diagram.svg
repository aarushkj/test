<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">ESP32 Distance Sensor: Circuit Diagram</text>

  <!-- ESP32 -->
  <rect x="60" y="80" width="220" height="380" rx="8" fill="#eef3f8" stroke="#1f3a5f" stroke-width="2"/>
  <text x="170" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f3a5f">ESP32 DevKit V1</text>
  <g font-size="14" fill="#111" text-anchor="end">
    <text x="268" y="165">VIN (5 V)</text>
    <text x="268" y="225">GPIO 5</text>
    <text x="268" y="285">GPIO 18</text>
    <text x="268" y="345">GPIO 2</text>
    <text x="268" y="425">GND</text>
  </g>

  <!-- HC-SR04 -->
  <rect x="660" y="120" width="180" height="210" rx="8" fill="#eef8f0" stroke="#1f5f3a" stroke-width="2"/>
  <text x="750" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f5f3a">HC-SR04</text>
  <g font-size="14" fill="#111">
    <text x="672" y="165">VCC</text>
    <text x="672" y="225">TRIG</text>
    <text x="672" y="285">ECHO</text>
    <text x="672" y="318">GND</text>
  </g>

  <!-- VIN -> VCC -->
  <line x1="280" y1="160" x2="660" y2="160" stroke="#d62728" stroke-width="2.5"/>
  <!-- GPIO5 -> TRIG -->
  <line x1="280" y1="220" x2="660" y2="220" stroke="#1f77b4" stroke-width="2.5"/>

  <!-- ECHO -> R1 (1k) -> junction -> GPIO18 -->
  <line x1="660" y1="280" x2="590" y2="280" stroke="#2ca02c" stroke-width="2.5"/>
  <rect x="520" y="268" width="70" height="24" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="555" y="285" text-anchor="middle" font-size="13" fill="#111">1 kΩ</text>
  <line x1="520" y1="280" x2="280" y2="280" stroke="#2ca02c" stroke-width="2.5"/>
  <circle cx="440" cy="280" r="4.5" fill="#111"/>
  <!-- R2 (2k) junction -> GND rail -->
  <line x1="440" y1="280" x2="440" y2="318" stroke="#111" stroke-width="2.5"/>
  <rect x="428" y="318" width="24" height="62" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="462" y="354" font-size="13" fill="#111">2 kΩ</text>
  <line x1="440" y1="380" x2="440" y2="420" stroke="#111" stroke-width="2.5"/>
  <circle cx="440" cy="420" r="4.5" fill="#111"/>

  <!-- GPIO2 -> 220R -> LED -> GND rail -->
  <line x1="280" y1="340" x2="310" y2="340" stroke="#ff7f0e" stroke-width="2.5"/>
  <rect x="310" y="328" width="70" height="24" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="345" y="345" text-anchor="middle" font-size="13" fill="#111">220 Ω</text>
  <line x1="380" y1="340" x2="395" y2="340" stroke="#ff7f0e" stroke-width="2.5"/>
  <line x1="395" y1="340" x2="395" y2="362" stroke="#ff7f0e" stroke-width="2.5"/>
  <!-- LED symbol pointing down -->
  <polygon points="383,362 407,362 395,382" fill="#d62728" stroke="#111" stroke-width="1.5"/>
  <line x1="383" y1="382" x2="407" y2="382" stroke="#111" stroke-width="2.5"/>
  <text x="372" y="377" text-anchor="end" font-size="13" fill="#111">LED</text>
  <line x1="395" y1="382" x2="395" y2="420" stroke="#111" stroke-width="2.5"/>
  <circle cx="395" cy="420" r="4.5" fill="#111"/>

  <!-- GND rail -->
  <line x1="280" y1="420" x2="620" y2="420" stroke="#111" stroke-width="2.5"/>
  <line x1="620" y1="420" x2="620" y2="313" stroke="#111" stroke-width="2.5"/>
  <line x1="620" y1="313" x2="660" y2="313" stroke="#111" stroke-width="2.5"/>

  <!-- wire labels -->
  <g font-size="12" fill="#555">
    <text x="470" y="152" text-anchor="middle">5 V supply</text>
    <text x="470" y="212" text-anchor="middle">trigger pulse</text>
    <text x="350" y="272" text-anchor="middle">echo (3.3 V after divider)</text>
    <text x="540" y="438" text-anchor="middle">common ground</text>
  </g>

  <text x="450" y="495" text-anchor="middle" font-size="12" fill="#555">The 1 kΩ / 2 kΩ divider drops the 5 V ECHO signal to about 3.3 V for the ESP32 input.</text>
</svg>
